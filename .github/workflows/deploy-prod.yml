name: Deploy to Production (main)

# Every merge to main is a production deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.example"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# Serialize deploys: a newer push cancels an in-flight build so rapid merges
# do not race to overwrite the :latest tag.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # The reference project deploys without a test gate. This one does not:
  # the whole product claim rests on the simulation being correct, so the
  # statistical validation must pass before an image can ship. The job itself
  # lives in checks.yml, which also gates dev and every pull request.
  test:
    uses: ./.github/workflows/checks.yml

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        # GHCR paths must be lowercase, and a leading dash in the repo name
        # breaks the path. Same normalisation as the reference project.
        run: |
          IMAGE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | sed 's|/-|/|')
          echo "name=ghcr.io/${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Jelastic redeploy
        # NOTE: the GHCR package must be set to Public once, by hand, after
        # the first push (GO-LIVE step 3). Jelastic cannot pull a private
        # image without registry credentials, and the only symptom is a node
        # that never comes up.
        run: |
          if [ -z "${{ secrets.JELASTIC_WEBHOOK_PROD }}" ]; then
            echo "::warning::JELASTIC_WEBHOOK_PROD is not set; skipping redeploy."
            exit 0
          fi
          # --fail-with-body: without it an HTTP error from Jelastic exits 0,
          # and a redeploy that never happened reads as green.
          curl -sS --fail-with-body -X GET "${{ secrets.JELASTIC_WEBHOOK_PROD }}"
