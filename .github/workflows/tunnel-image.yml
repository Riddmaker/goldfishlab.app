# Build, check, publish and sign the tunnel image (tunnel/Dockerfile).
#
# Its own workflow because the image lives apart from the application: it
# changes only with cloudflared or its Alpine base (Dependabot pull requests),
# and a new tunnel image deliberately triggers NO redeploy - the tunnel node is
# switched to the new commit tag by hand, and the tunnel's status is checked
# in Cloudflare afterwards.
#
# Action versions as in deploy-prod.yml; Dependabot keeps both current.
name: Tunnel image

on:
  push:
    branches: [main]
    paths:
      - "tunnel/**"
      - ".github/workflows/tunnel-image.yml"
  # A rebuild without a change, e.g. before the first import. Effective on
  # main only (see the job condition).
  workflow_dispatch:

concurrency:
  group: tunnel-image
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/riddmaker/goldfishlab.app-tunnel

jobs:
  build-push:
    name: Build, check, push and sign the tunnel image
    # As in deploy-prod.yml: nothing reaches the registry from another branch -
    # not even a `latest` that a fresh import would pull.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # GHCR push
      id-token: write # OIDC token for keyless cosign and the attestation
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Commit SHA = immutable tag for upgrading the node; `latest` exists
          # for the first manifest import alone.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build (locally, for the trial run)
        uses: docker/build-push-action@v7.3.0
        with:
          context: tunnel
          load: true
          tags: goldfishlab-tunnel:probe
          cache-from: type=gha,scope=tunnel
          cache-to: type=gha,scope=tunnel,mode=max

      - name: Trial run
        # Before the push: the binary starts on this base, the base is a
        # distribution Jelastic accepts, and the process is not root.
        run: |
          docker run --rm goldfishlab-tunnel:probe version
          docker run --rm --entrypoint cat goldfishlab-tunnel:probe /etc/os-release \
            | grep -qx 'ID=alpine' \
            || { echo "::error::The base is not Alpine"; exit 1; }
          uid="$(docker run --rm --entrypoint id goldfishlab-tunnel:probe -u)"
          [ "${uid}" != "0" ] || { echo "::error::The image runs as root"; exit 1; }

      - name: Push
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: tunnel
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tunnel

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # The same version as deploy-prod.yml and redeploy.yml.
          cosign-release: v3.0.6

      - name: Sign the image (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the signature at once
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/tunnel-image.yml@${{ github.ref }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "Signature valid for ${IDENTITY}"

      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
