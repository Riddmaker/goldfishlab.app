{% comment %}
  One big button, and the same link written out under it for clients that
  strip buttons or links. Takes `url` and `label`.
{% endcomment %}
{% load i18n %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 20px;">
  <tr>
    <td style="background-color:#86231d;border-radius:4px;">
      <a href="{{ url }}" style="display:inline-block;padding:12px 24px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;font-weight:bold;color:#ffffff;text-decoration:none;">{{ label }}</a>
    </td>
  </tr>
</table>
<p style="margin:0 0 16px;font-size:13px;line-height:20px;color:#5d564a;">
  {% translate "Button not working? Copy this link into your browser:" %}
  <br>
  <a href="{{ url }}" style="color:#86231d;word-break:break-all;">{{ url }}</a>
</p>
