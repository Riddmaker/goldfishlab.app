{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Goldfish Lab{% endblock %}</title>
    <meta name="description"
          content="{% block description %}Goldfish Lab actually plays your Commander deck, thousands of times, and tells you what happens.{% endblock %}">
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% comment %}
      htmx injects a <style> element into <head> on load, carrying the two
      `.htmx-indicator` rules. Our Content-Security-Policy refuses it -
      `style-src 'self'` with no `'unsafe-inline'` - so every page in the
      application logged a CSP violation and the indicator rules never applied.

      Found in the Phase 8 screenshot pass by reading the browser console, not
      by a test: every page still answered HTTP 200 and looked correct, because
      nothing uses the class yet. It would have broken the first loading
      spinner somebody added, months later, with no clue pointing here.

      The alternative was whitelisting htmx's style hash. This is better: there
      is then no inline style element on any page at all, and nothing to
      re-hash when htmx is upgraded. The two rules live in input.css instead.
    {% endcomment %}
    <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
    {% comment %}
      Self-hosted and version-pinned (scripts/get_htmx.py). No CDN: the page
      keeps working when a third party does not, nobody else learns who visits,
      and no external host can run its own script on a signed-in user's page.
      `defer` because nothing here needs htmx before the document exists.
    {% endcomment %}
    <script src="{% static 'js/htmx.min.js' %}" defer></script>
    {% block head %}{% endblock %}
  </head>
  <body class="min-h-screen flex flex-col">
    <a href="#main"
       class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-parchment-100 focus:text-ink-900 focus:px-3 focus:py-2">
      Skip to content
    </a>
    <header class="border-b border-ink-800">
      {% comment %}
        `flex-wrap` on both rows, found in the Phase 8 screenshot pass: signed
        in at 390px the right-hand group could not fit and "Sign out" was
        clipped off the edge of the page on EVERY screen, not just a new one.
        A nav that cannot be signed out of is the kind of thing a view test
        answers HTTP 200 to.
      {% endcomment %}
      <nav class="mx-auto flex max-w-5xl flex-wrap items-baseline gap-x-6 gap-y-2 px-4 py-4">
        {% comment %}
          On the home page (phase 10 F) the mark is the inline logo, and the
          fish in it is alive: static/js/fish.js plays a short move now and
          then, and clicking the logo makes it react instead of reloading the
          page it is already on. Without that script it is a plain link.
          Everywhere else the mark stays the static image.
        {% endcomment %}
        {% if request.resolver_match.url_name == "home" %}
          <a href="{% url 'home' %}"
             aria-current="page"
             data-fish-link
             class="flex items-baseline gap-2 font-display text-xl tracking-wide text-parchment-100 hover:text-parchment-50">
            {% include "core/_logo.html" with id="home-logo" class="logo-home self-center" %}
            Goldfish&nbsp;Lab
          </a>
        {% else %}
          <a href="{% url 'home' %}"
             class="flex items-baseline gap-2 font-display text-xl tracking-wide text-parchment-100 hover:text-parchment-50">
            <img src="{% static 'img/favicon.svg' %}" alt="" width="28" height="28" class="self-center">
            Goldfish&nbsp;Lab
          </a>
        {% endif %}
        <span class="hidden text-sm text-ink-400 sm:inline">it actually plays your deck</span>
        <div class="ml-auto flex flex-wrap items-baseline justify-end gap-x-4 gap-y-1 text-sm">
          {% if user.is_guest %}
            {% comment %}
              A guest (phase 9 G) is signed in but has no account: its deck,
              the way to keep it, and the way in for somebody who has one.
            {% endcomment %}
            <a href="{% url 'decks:list' %}"
               class="text-parchment-200 underline hover:text-parchment-50">Your deck</a>
            <a href="{% url 'guests:save' %}"
               class="border border-blood-800 bg-blood-700 px-3 py-1 text-parchment-100 hover:bg-blood-800">Save your deck - free</a>
            <a href="{% url 'account_login' %}"
               class="text-parchment-200 underline hover:text-parchment-50">Sign in</a>
          {% elif user.is_authenticated %}
            <a href="{% url 'decks:list' %}"
               class="text-parchment-200 underline hover:text-parchment-50">Decks</a>
            <a href="{% url 'decks:import' %}"
               class="text-parchment-200 underline hover:text-parchment-50">Import</a>
            <a href="{% url 'billing:plans' %}"
               class="text-parchment-200 underline hover:text-parchment-50">Your plan</a>
            <span class="text-ink-300">{{ user.email }}</span>
            <form method="post" action="{% url 'account_logout' %}">
              {% csrf_token %}
              <button type="submit"
                      class="text-parchment-200 underline hover:text-parchment-50">Sign out</button>
            </form>
          {% else %}
            <a href="{% url 'account_login' %}"
               class="text-parchment-200 underline hover:text-parchment-50">Sign in</a>
            <a href="{% url 'account_signup' %}"
               class="text-parchment-200 underline hover:text-parchment-50">Create account</a>
          {% endif %}
        </div>
      </nav>
    </header>
    <main id="main" class="mx-auto w-full max-w-5xl flex-1 px-4 py-10">
      {% if messages %}
        {% for message in messages %}
          <div class="mb-4 border border-parchment-600 bg-ink-900 px-4 py-3 text-parchment-100">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% block main %}
        {% block content %}{% endblock %}
      {% endblock %}
    </main>
    <footer class="border-t border-ink-800">
      <div class="mx-auto max-w-5xl px-4 py-6 text-xs leading-relaxed text-ink-400">
        <p class="flex flex-wrap gap-x-4 gap-y-1">
          <a href="{% url 'methodology' %}" class="underline hover:text-ink-300">How this works</a>
          <a href="{% url 'terms' %}" class="underline hover:text-ink-300">Terms</a>
          <a href="{% url 'privacy' %}" class="underline hover:text-ink-300">Privacy</a>
          <a href="{% url 'imprint' %}" class="underline hover:text-ink-300">Legal notice</a>
          {% if user.is_authenticated and not user.is_guest %}
            <a href="{% url 'accounts:data' %}" class="underline hover:text-ink-300">Your data</a>
          {% endif %}
          {% if show_dev_tools %}
            <a href="{% url 'styleguide' %}" class="underline hover:text-ink-300">Styleguide</a>
          {% endif %}
          {% if source_code_url %}
            <a href="{{ report_url }}" class="underline hover:text-ink-300" rel="noopener">Report a problem</a>
            <a href="{{ source_code_url }}" class="underline hover:text-ink-300" rel="noopener">Source code (AGPL)</a>
          {% endif %}
          {% if operator.email %}
            <a href="mailto:{{ operator.email }}" class="underline hover:text-ink-300">Email us</a>
          {% endif %}
        </p>
        <p class="mt-2 max-w-3xl">
          Goldfish Lab is unofficial Fan Content permitted under the
          <a href="https://company.wizards.com/en/legal/fancontentpolicy" class="underline hover:text-ink-300" rel="noopener">Fan Content Policy</a>.
          Not approved/endorsed by Wizards. Portions of the materials used are property of
          Wizards of the Coast. ©Wizards of the Coast LLC.
        </p>
        <p class="mt-2 max-w-3xl">
          Card data and images from <a href="https://scryfall.com" class="underline hover:text-ink-300" rel="noopener">Scryfall</a>;
          combos from <a href="https://commanderspellbook.com" class="underline hover:text-ink-300" rel="noopener">Commander Spellbook</a>.
          Neither is affiliated with Goldfish Lab.
        </p>
      </div>
    </footer>
  </body>
</html>
