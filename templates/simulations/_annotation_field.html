<div class="form-field">
  <label for="{{ field.id_for_label }}" class="block text-ink-900">{{ field.label }}</label>
  <p class="text-sm text-ink-700">{{ field.help_text }}</p>
  <div class="mt-1">{{ field }}</div>
  {% if field.errors %}
    <ul class="mt-1 text-sm text-blood-700">
      {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  {% endif %}
</div>
